# =============================================================================
# CellCounter Pipeline Configuration
# =============================================================================
# Copy this file to your project directory and edit as needed.
# All values shown are the pipelinue defaults.
#
# Usage:
#   from cellcounter.models import ProjConfig
#   config = ProjConfig.read_yaml("default_config.yaml")
# =============================================================================

# ---------------------------------------------------------------------------
# Zarr chunk sizes (voxels). Larger chunks = more memory, fewer I/O calls.
# ---------------------------------------------------------------------------
chunks:
  z: 500
  y: 500
  x: 500

# ---------------------------------------------------------------------------
# Tuning crop — subset extracted for parameter exploration.
# Set start/stop/step per axis; None means full range.
# ---------------------------------------------------------------------------
tuning_trim:
  z:
    start: 0
    stop: 100
    step: null
  y:
    start: 0
    stop: 2000
    step: null
  x:
    start: 0
    stop: 2000
    step: null

# ---------------------------------------------------------------------------
# Dask cluster sizing for parallel processing.
#   heavy_* — few workers, high memory (registration, elastix)
#   busy_*  — many workers, lower memory (cell counting)
# ---------------------------------------------------------------------------
cluster:
  heavy_n_workers: 2
  heavy_threads_per_worker: 1
  busy_n_workers: 6
  busy_threads_per_worker: 2

# ---------------------------------------------------------------------------
# Reference atlas paths. Set atlas_dir to your local atlas resources.
# ref_version, annot_version, map_version select which atlas to use.
# ---------------------------------------------------------------------------
reference:
  atlas_dir: ~/.cellcounter/atlas_resources
  ref_version: average_template_25
  annot_version: ccf_2016_25
  map_version: aba_annotations

# ---------------------------------------------------------------------------
# Registration parameters.
#
# ref_orientation — flips/permutes axes to match atlas orientation.
#   Values must be 1, 2, 3 (optionally negated), one per axis.
#   Positive = same direction; negative = flipped.
#
# ref_trim / reg_trim — crop before/after registration.
#
# downsample_rough — initial coarse downsample (integer factors).
# downsample_fine — final sub-voxel downsample (0 < factor <= 1).
#
# lower/upper_bound — intensity clipping range.
# ---------------------------------------------------------------------------
registration:
  ref_orientation:
    z: 1
    y: 3
    x: -2
  ref_trim:
    z:
      start: null
      stop: null
      step: null
    y:
      start: null
      stop: null
      step: null
    x:
      start: null
      stop: null
      step: null
  downsample_rough:
    z: 3
    y: 6
    x: 6
  downsample_fine:
    z: 1.0
    y: 0.6
    x: 0.6
  reg_trim:
    z:
      start: null
      stop: null
      step: null
    y:
      start: null
      stop: null
      step: null
    x:
      start: null
      stop: null
      step: null
  lower_bound: 100
  lower_bound_mapto: 0
  upper_bound: 5000
  upper_bound_mapto: 5000

# ---------------------------------------------------------------------------
# Cell counting parameters.
#
# cell_diameter_px — physical cell diameter in voxels, per axis (z, y, x).
#   Because acquisition voxels are anisotropic (z is usually thicker than
#   x/y), the diameter differs per axis. Every filter size below is derived
#   from this diameter by a dimensionless scale factor, so anisotropy is
#   handled automatically.
#
# tophat_radius_scale — top-hat background subtraction radius, as a multiple
#   of cell_diameter_px.
#   Rule of thumb (https://www.cell.com/cell-reports/fulltext/S2211-1247(22)00371-0, https://pmc.ncbi.nlm.nih.gov/articles/PMC8592694/):
#     tophat radius is 30% to 50% larger than largest cFos cell diameter.
#
# dog_sigma1_scale / dog_sigma2_scale — Difference-of-Gaussian bandpass, as
#   multiples of cell_diameter_px. Must satisfy dog_sigma1_scale < dog_sigma2_scale.
#   Rule of thumb (https://bioimagebook.github.io/chapters/appendices/macros/macro_dog.html):
#     dog_sigma1 is 1/4 to 1/2 of average cFos cell diameter
#     dog_sigma2 is 1.4 (in other books 1.6 to 2.0) times dog_sigma1
#
# maxima_radius_scale — local maxima detection radius, as a multiple of
#   cell_diameter_px.
#
# large_gauss_radius — radius for large-scale background estimation, absolute
#   and per-axis (z, y, x). Including in case, but in most cases this step can
#   be skipped. To skip, set large_gauss_radius to null.
#
# threshold_value — absolute intensity threshold.
# min/max_threshold_volume — size filter on thresholded blobs, in voxels.
#   Must satisfy min < max.
#
# min/max_watershed_volume — size filter after watershed, in voxels.
#   Must satisfy min < max.
# ---------------------------------------------------------------------------
cell_counting:
  cell_diameter_px:
    z: 3.0
    y: 10.0
    x: 10.0
  tophat_radius_scale: 1.8
  dog_sigma1_scale: 0.6
  dog_sigma2_scale: 1.4
  maxima_radius_scale: 1.0
  large_gauss_radius: null
  threshold_value: 100
  min_threshold_volume: 1
  max_threshold_volume: 15000
  min_watershed_volume: 1
  max_watershed_volume: 1000

# ---------------------------------------------------------------------------
# Visual QC settings.
#
# heatmap_raw_radius — radius for raw-coordinate heatmap kernel.
# heatmap_trfm_radius — radius for transformed-coordinate heatmap kernel.
# cellcount_trim — crop region for visual inspection of cell detection.
# ---------------------------------------------------------------------------
visual_check:
  heatmap_raw_radius: 5
  heatmap_trfm_radius: 3
  cellcount_trim:
    z:
      start: 500
      stop: 510
      step: null
    y:
      start: null
      stop: null
      step: null
    x:
      start: null
      stop: null
      step: null
